name: Publish Beta

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DPI Control
        uses: actions/checkout@v4

      - name: Checkout pinned TG WS engine
        uses: actions/checkout@v4
        with:
          repository: L33kr/tg-ws-proxy-android
          ref: 94d0620aff9a9e0dd08a1f9688a904da09df497e
          path: third_party/tg-ws-proxy-android

      - name: Checkout current ByeDPI core
        uses: actions/checkout@v4
        with:
          repository: hufrea/byedpi
          ref: ba532298de7b28cfe854aea83d061369d13ca290
          path: third_party/byedpi

      - name: Checkout current hev-socks5-tunnel
        uses: actions/checkout@v4
        with:
          repository: heiher/hev-socks5-tunnel
          ref: 941c758101385d145c66210ac88991daaf27d4b6
          path: third_party/hev-socks5-tunnel
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android native toolchain
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build beta APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DPI-Control-v0.4.0-beta.1.apk

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-beta.1
          target_commitish: ${{ github.sha }}
          name: DPI Control v0.4.0-beta.1
          prerelease: true
          generate_release_notes: false
          body: |
            ## DPI Control v0.4.0-beta.1

            Первый beta-релиз объединённого Android-клиента.

            ### Уже работает
            - Android VpnService + ByeDPI + hev-socks5-tunnel.
            - Каталог готовых стратегий и ручные аргументы ByeDPI.
            - Фильтрация по доменам: весь трафик, только список, список исключений.
            - Быстрые списки YouTube, Discord и Google Media.
            - Автотест стратегий по 10 контрольным хостам.
            - Telegram WS Proxy с запуском локального MTProto-прокси и передачей конфигурации в Telegram.
            - Тёмный Material 3 интерфейс и собственная иконка.

            ### Beta
            Работа DPI-стратегий зависит от провайдера и сети. Этот релиз фиксирует текущую рабочую базу перед дальнейшей переработкой профилей/наборов в стиле zapretgui.
          files: DPI-Control-v0.4.0-beta.1.apk
          fail_on_unmatched_files: true
